name: Update Google Scholar Stats

on:
  schedule:
    - cron: '0 0 * * *'   # 每天UTC时间0点运行一次
  workflow_dispatch:

permissions:
  contents: write  # 允许工作流推送更改

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 增加超时时间
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false  # 重要：避免后续push失败
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install scholarly beautifulsoup4 requests
        
    - name: Run Scholar Script
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        # 如有代理可在这里添加
        # HTTP_PROXY: ${{ secrets.PROXY_URL }}
        # HTTPS_PROXY: ${{ secrets.PROXY_URL }}
      run: python build.py
        
    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@users.noreply.github.com"
        
        # 仅当有变化时提交
        git add results/
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit."
        else
          git commit -m "📈 Auto-update Google Scholar stats at $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        fi
