name: Update Scholar Metrics

on:
  schedule:
    # 每天运行两次：北京时间 12:00 和 0:00
    - cron: '0 4 * * *'   # UTC 4:00 (北京时间 12:00)
    - cron: '0 16 * * *'  # UTC 16:00 (北京时间 0:00)
  workflow_dispatch:      # 允许手动触发

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 防止任务卡住
    
    env:
      SCHOLAR_ID: ${{ secrets.SCHOLAR_ID }}  # 在仓库设置中添加
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install requests beautifulsoup4
    
    - name: Run Scholar Scraper
      run: |
        if [ -n "$SCHOLAR_ID" ]; then
          python scholar_scraper.py
        else
          echo "WARNING: SCHOLAR_ID not set, using default ID"
          python scholar_scraper.py
        fi
      env:
        SCHOLAR_ID: ${{ secrets.SCHOLAR_ID }}
    
    - name: Commit and push changes
      if: always()  # 无论任务是否成功都提交，保留错误信息
      run: |
        git config --local user.email "scholar-updater@github.com"
        git config --local user.name "Scholar Metrics Updater"
        git add results
        git diff-index --quiet HEAD || git commit -m "更新学术数据 [skip ci]"
        git push
