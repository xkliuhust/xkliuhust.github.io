name: Update Google Scholar Data

on:
  schedule:
    - cron: '0 12 * * *'  # 每天UTC时间中午12点运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium beautifulsoup4 Pillow pytesseract requests
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr libtesseract-dev
        
    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        install-only: true
        
    - name: Run Scholar Scraper
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      run: python scholar_scraper.py
        
    - name: Commit and Push Changes
      run: |
        git config --global user.name "Scholar Bot"
        git config --global user.email "actions@users.noreply.github.com"
        
        # 查看文件变化
        git status
        
        # 添加所有更改（包括About.md）
        git add results/* About.md
        
        # 检查是否有需要提交的更改
        if git diff --staged --quiet; then
          echo "没有变化需要提交"
        else
          git commit -m "📊 Auto-update Google Scholar data and About.md"
          git push
        fi
