name: Update Scholar Data

on:
  schedule:
    # 每天运行两次：UTC 2:00 和 UTC 14:00（北京时间10:00和22:00）
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 设置超时防止卡死
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: Run Scholar Scraper
      run: |
        # 如果设置了环境变量则使用，否则脚本会使用示例ID
        if [ -n "${{ secrets.SCHOLAR_ID }}" ]; then
          export GOOGLE_SCHOLAR_ID="${{ secrets.SCHOLAR_ID }}"
          echo "使用Secret中的Scholar ID"
        fi
        
        python scholar_scraper.py
        
    - name: Commit changes
      run: |
        git config user.email "actions@github.com"
        git config user.name "Scholar Data Updater"
        
        # 检查是否有变更
        if git diff-index --quiet HEAD --; then
          echo "无变更需要提交"
        else
          git add results
          git commit -m "自动更新Google Scholar数据 [skip ci]"
          git push
        fi
