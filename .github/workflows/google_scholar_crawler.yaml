name: Update Google Scholar Stats

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时运行一次
  workflow_dispatch:        # 允许手动触发

concurrency:
  group: scholar-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-scholar-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0
        
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium Pillow pytesseract pytesseract
        
    - name: Install System Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr libtesseract-dev
        sudo apt-get install -y libgl1 libglib2.0-0
        
    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: 'stable'
        
    - name: Run Scholar Scraper
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      run: python scholar_scraper.py
        
    - name: Upload Debug Artifacts
      uses: actions/upload-artifact@v3
      if: always()   # 即使失败也上传
      with:
        name: scholar-debug-artifacts
        path: results/*
        retention-days: 30
        
    - name: Commit and Push Changes
      run: |
        git config --global user.name "Scholar Bot"
        git config --global user.email "scholar-bot@users.noreply.github.com"
        
        # 确定需要提交的变更
        git add -A
        git status
        
        # 只有当有变更时才提交
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "📊 Auto-update Scholar stats: $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "Changes committed and pushed"
        else
          echo "No changes to commit"
        fi
