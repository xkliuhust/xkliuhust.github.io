name: Scholar Stats with OCR

on:
  schedule:
    - cron: '0 2-23/6 * * *'  # 每天每6小时运行一次（避开午夜高峰）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:

    runs-on: ubuntu-latest
    timeout-minutes: 25  # 设置更长超时时间

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install System Dependencies (Tesseract)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr libtesseract-dev

    - name: Install Chrome and WebDriver
      uses: browser-actions/setup-chrome@v1
      with:
        install-only: true

    - name: Run Scholar Script
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      run: |
        python scholar_fetcher.py
        ls -lh results/*

    - name: Commit and Push Changes
      if: success()
      run: |
        git config --global user.name "GitHub Actions Scholar Bot"
        git config --global user.email "actions@users.noreply.github.com"
        
        # 确保仅当有新数据时才提交
        if git diff --quiet --exit-code -- results/ || [ -z "$(git status --porcelain)" ]; then
          echo "没有变化需要提交"
        else
          git add results/
          git commit -m "📊 自动更新学术引用数据: ${{ secrets.GOOGLE_SCHOLAR_ID }}"
          git push
        fi
