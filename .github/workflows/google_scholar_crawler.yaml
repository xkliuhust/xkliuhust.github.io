name: Update Google Scholar Stats

on:
  schedule:
    # 每天凌晨运行（降低频率避免被封）
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  get-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 设置超时防止卡住
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install scholarly jsonpickle
        
    - name: Run Scholar Script
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      run: python build.py
        
    - name: Commit and Push if Data Changed
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@users.noreply.github.com"
        git add results/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update scholar data at $(date +'%Y-%m-%d %H:%M')" && git push)
