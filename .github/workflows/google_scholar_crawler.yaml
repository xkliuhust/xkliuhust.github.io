name: Auto-Update Scholar Metrics

on:
  schedule:
    # 每天北京时间 4:00 和 16:00 运行
    - cron: "0 20 * * *"  # UTC 20:00 = 北京时间 4:00
    - cron: "0 8 * * *"   # UTC 8:00 = 北京时间 16:00
  workflow_dispatch:      # 允许手动触发

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    env:
      # 从GitHub Secrets读取Scholar ID
      GOOGLE_SCHOLAR_ID: ${{ secrets.SCHOLAR_ID }}
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
    
    - name: 运行 Scholar 爬虫
      run: python scholar_scraper.py
      env:
        # 如果SECRET未设置，使用默认学者ID
        GOOGLE_SCHOLAR_ID: ${{ secrets.SCHOLAR_ID || 'B7vSqZsAAAAJ' }}
    
    - name: 提交更新结果
      id: commit
      continue-on-error: true  # 即使爬虫失败也提交结果
      run: |
        git config user.email "actions@github.com"
        git config user.name "Scholar Data Updater"
        
        # 仅当结果文件有变化时提交
        if git diff --exit-code --quiet -- results; then
          echo "无数据变更"
        else
          git add results
          git commit -m "自动更新学术数据 [skip ci]"
          git push
          echo "提交成功!"
        fi
    
    - name: 保存日志文件
      if: always()  # 无论任务成功与否都保存日志
      uses: actions/upload-artifact@v3
      with:
        name: scholar-crawler-logs
        path: scholar_crawler.log
